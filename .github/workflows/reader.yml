# Test, build every law from history/, export the reader's data, and deploy reader/ to GitHub Pages.
name: Reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: node --test reader/app.test.mjs
      - name: Build the laws and export the reader's data
        run: |
          for history in history/*.yaml; do
            law=$(basename "$history" .yaml)
            uv run publish/build_repo.py "$history" "out/$law"
            uv run publish/export.py "out/$law" "reader/data/$law.json"
            echo "$law HEAD $(git -C "out/$law" rev-parse HEAD)"  # must match the pushed law repository
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader
      - id: deployment
        uses: actions/deploy-pages@v4
