<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>git blame the Constitution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<style>
:root{
  --bg:#f3f4f1;--surface:#fff;--inset:#eceee9;--ink:#14171a;--ink-2:#4a5056;--ink-3:#697076;--line:#d9dcd5;--line-2:#bfc4bd;
  --mark:#ffe14d;--mark-ink:#3a2f00;--add-bg:#d9f2d9;--add-ink:#0b5a0b;--rem-bg:#f9dede;--rem-ink:#8f1d1d;
  --era1:#2a78d6;--era2:#eb6834;--era3:#1baf7a;--era4:#eda100;--era5:#8a5cd6;--era6:#d6457a;--era7:#0e9aa7;--era8:#8d6e3f;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--f-law:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1113;--surface:#171a1d;--inset:#1f2327;--ink:#eceeeb;--ink-2:#b5babf;--ink-3:#8b9197;--line:#2b3035;--line-2:#41474d;
  --mark:#5c4b0b;--mark-ink:#fff0b3;--add-bg:#173a1d;--add-ink:#97e597;--rem-bg:#401a1a;--rem-ink:#f5a9a9;
  --era1:#3987e5;--era2:#d95926;--era3:#199e70;--era4:#c98500;--era5:#9b74e0;--era6:#d9608c;--era7:#26b3bf;--era8:#b08a55;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-ui);padding:0 16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin-inline:auto}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--era1);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{font-weight:600;font-size:18px;text-decoration:none}
.brand code{font:500 .95em var(--f-mono)}
.disclaimer{margin:0;font-size:13px;color:var(--ink-2)}
.disclaimer b{background:var(--mark);color:var(--mark-ink);padding:1px 6px;border-radius:4px;font-weight:600}
h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
.lede{font-size:18px;color:var(--ink-2);max-width:62ch;margin:0 0 24px}
.sub{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:32px 0 10px}
.crumb{font:13px var(--f-mono);color:var(--ink-2);margin:0 0 10px;overflow-wrap:anywhere}
.status{font-size:14px;color:var(--ink-2);margin:12px 0}
.error{color:var(--rem-ink)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc a{display:block;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none}
.toc a:hover{border-color:var(--ink-3)}
.toc small{display:block;font:12px var(--f-mono);color:var(--ink-3)}
.timeline{list-style:none;margin:0;padding:0;font-size:14px}
.timeline li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:2px 14px;padding:10px 0;border-top:1px solid var(--line)}
.timeline time{font:13px var(--f-mono);color:var(--ink-3);padding-top:1px}
.timeline .files{grid-column:2;font:12.5px var(--f-mono);display:flex;flex-wrap:wrap;gap:4px 12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:8px;font-size:14px;color:var(--ink-2)}
input,select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
input[type=range]{flex:1;min-width:180px;padding:0;border:0;background:none;accent-color:var(--ink)}
.ticks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.ticks a{font:12px var(--f-mono);padding:3px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink-2)}
.ticks a[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.law{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;font:17px/1.7 var(--f-law)}
.law h2,.lines h2{font:600 18px/1.4 var(--f-law);margin:0 0 12px}
.law p,.lines p{margin:0 0 10px;padding-left:calc(var(--depth,0) * 1.6em)}
.law p:last-child,.lines p:last-child{margin-bottom:0}
.diff{white-space:pre-wrap}
ins{background:var(--add-bg);color:var(--add-ink);text-decoration:none;border-radius:3px;padding:0 1px}
del{background:var(--rem-bg);color:var(--rem-ink);border-radius:3px;padding:0 1px}
.blame-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.blame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.blk{display:grid;grid-template-columns:12rem minmax(0,1fr);border-top:1px solid var(--line);cursor:pointer}
.blk:first-child{border-top:0}
.gut{display:grid;gap:2px;align-content:start;padding:12px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.gut code{font:500 12px var(--f-mono);color:var(--ink)}
.lines{padding:12px 16px;font:16px/1.65 var(--f-law)}
.lines:empty{padding:0}
.blk:hover .gut,.blk:focus-visible .gut,.blk.on .gut{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.card{border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:16px;background:var(--surface);font-size:14px;position:sticky;top:16px}
.card h3{margin:0 0 10px;font-size:17px;line-height:1.3}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 12px}
.card dt{color:var(--ink-3)}
.card dd{margin:0;overflow-wrap:anywhere}
.amending{white-space:pre-wrap;font:14px/1.55 var(--f-law);background:var(--inset);border-radius:8px;padding:10px 12px;margin:0 0 12px;max-height:22rem;overflow:auto}
@media (max-width:860px){.blame-wrap{grid-template-columns:1fr}.card{position:static}}
@media (max-width:640px){
  .blk{grid-template-columns:1fr}.gut{border-left:0;border-top:5px solid var(--c)}
  .law{padding:16px}.timeline li{grid-template-columns:1fr}.timeline .files{grid-column:1}
}
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="#/"><code>git blame</code> the Constitution</a>
  <p class="disclaimer"><b>Unofficial</b> Not legal advice. <a id="official" href="https://www.indiacode.nic.in">Official text</a></p>
</header>
<main class="wrap" id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
