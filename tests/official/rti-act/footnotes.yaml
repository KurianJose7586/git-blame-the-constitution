# Footnotes on DoPT's consolidated text ("The Right to Information Act, 2005 [As on the 18th November, 2025]"),
# written as the blame each line must have. A line matching no entry must blame to `base`.
# `line` is a substring of exactly one line of the law file. Blank lines are not checked.
#
# The fixtures beside this file are that text as extracted, with footnote numbers removed. Hand fixes:
# - schedule-1.txt: the extraction puts the stacked alternative "swear in the name of God / solemnly affirm"
#   out of order; it is put back in reading order, with a slash between the alternatives.
# - preamble.txt "expendient" and chapter-ii/section-004.txt "suomotu" are typos in DoPT's copy. The 2005
#   Gazette has "expedient" and "suo motu", and no amendment touched either, so the fixtures follow the Gazette.
# - chapter-iii/section-013.txt: DoPT adds "(24 of 2019)" twice to the second proviso of s. 13(5), and
#   chapter-iv/section-016.txt has "there under". Section 2 and 3 of the Right to Information (Amendment) Act,
#   2019, which inserted that text, have neither, so the fixtures follow the Act.
# - chapter-*/README.txt: the chapter headings ("CHAPTER III" and its title), from the same text.
# - schedule-2.txt, two fixes from the notifications themselves (read on the e-Gazette):
#   - entry 8 reads "Special [Frontier] Force." DoPT (and India Code) add "of the Cabinet Secretariat", but
#     the 2005 Act printed "8. Special Prontier Force." and G.S.R. 319(E) of 2021 only replaced the word
#     "Prontier"; no notification added those words.
#   - entry 27 is added: G.S.R. 864(E) of 23 Nov 2023 inserted "27. Indian Computer Emergency Response Team.",
#     which DoPT's copy "as on 18 Nov 2025" doesn't have.

