  - act: The Constitution (Forty-second Amendment) Act, 1976
    enacted: 1976-12-18          # the Act: "[18th December, 1976.]"
    source: https://www.legislative.gov.in/static/uploads/2025/07/9f820a53b6e6840a459bde27eb5d24e5.pdf
    sections:
