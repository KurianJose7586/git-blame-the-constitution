    enacted: 1949-11-26          # COI, Preamble: "this twenty-sixth day of November, 1949"
    source: https://www.legislative.gov.in/static/uploads/2025/07/95ef471035ee0b5e4e5b1cac3d3584c1.pdf
    sections:
      - section: null
        in_force: 1950-01-26     # COI, article 394
        files:
          preamble.md: |
            # PREAMBLE

            WE, THE PEOPLE OF INDIA, having solemnly resolved to constitute India into a SOVEREIGN DEMOCRATIC REPUBLIC and to secure to all its citizens:

            JUSTICE, social, economic and political;

            LIBERTY of thought, expression, belief, faith and worship;

            EQUALITY of status and of opportunity;

            and to promote among them all

            FRATERNITY assuring the dignity of the individual and the unity of the Nation;

            IN OUR CONSTITUENT ASSEMBLY this twenty-sixth day of November, 1949, do HEREBY ADOPT, ENACT AND GIVE TO OURSELVES THIS CONSTITUTION.
          part-iii/article-015.md: |
            # 15. Prohibition of discrimination on grounds of religion, race, caste, sex or place of birth.

            - (1) The State shall not discriminate against any citizen on grounds only of religion, race, caste, sex, place of birth or any of them.
            - (2) No citizen shall, on grounds only of religion, race, caste, sex, place of birth or any of them, be subject to any disability, liability, restriction or condition with regard to—
              - (a) access to shops, public restaurants, hotels and places of public entertainment; or
              - (b) the use of wells, tanks, bathing ghats, roads and places of public resort maintained wholly or partly out of State funds or dedicated to the use of the general public.
            - (3) Nothing in this article shall prevent the State from making any special provision for women and children.

